name: CI

# Runs on every push and every pull request. The point is that a change which
# breaks the build or the tests is visible on the commit itself, rather than
# being discovered later by whoever pulls next.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.m2 between runs; without it every build re-downloads
          # every dependency.
          cache: maven

      - name: Build and run tests
        working-directory: backend
        run: mvn -B verify

      - name: Publish test report
        # `always()` so the report is still published when tests fail — which
        # is precisely when you want to read it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend — type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` not `npm install`: installs exactly what the lockfile says and
      # fails if package.json and the lockfile disagree.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    # Only worth checking once the code itself is known good.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cyclehaven-api ./backend

      - name: Build frontend image
        run: docker build -t cyclehaven-web ./frontend
