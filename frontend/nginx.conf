server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints asset filenames (index-BCIYzqWI.js), so the content of a
    # given filename never changes and it can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached — it is the file that points at the current
    # fingerprinted bundles. Caching it would pin browsers to an old release.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy the API through the same origin as the site. This means the browser
    # never makes a cross-origin request, so CORS does not apply in production
    # either, and the frontend needs no build-time API URL.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: the router owns the URL space, so any unknown path must
    # return index.html and let React decide. Without this, refreshing on
    # /shop or /admin returns a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
