# Default profile: local development.
# Uses a file-based H2 database so the API runs with zero external setup.
# Production overrides live in application-prod.yml (activate with SPRING_PROFILES_ACTIVE=prod).

spring:
  application:
    name: cyclehaven-api

  datasource:
    url: jdbc:h2:file:./data/cyclehaven;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # Hibernate manages the schema in dev. See README for the Flyway migration
      # path that would replace this in a production-grade deployment.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

# Application-specific settings
cyclehaven:
  jwt:
    # Dev-only default. Production MUST override via the JWT_SECRET env var.
    # Generate one with: openssl rand -base64 48
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZHVjdGlvbi1jaGFuZ2UtbWUtcGxlYXNl}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-email: ${SEED_ADMIN_EMAIL:admin@cyclehaven.com}
    # Dev-only default. Override in any real deployment.
    admin-password: ${SEED_ADMIN_PASSWORD:AdminPass123!}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.cyclehaven: INFO
    org.springframework.security: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html
