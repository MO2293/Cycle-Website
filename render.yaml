# Render Blueprint — provisions the API from this repository.
#
# Render reads this file when you create a Blueprint, so the service and every
# environment variable it needs are defined in version control rather than
# clicked together in a dashboard. Re-creating the deployment later is
# reproducible instead of archaeological.
#
# The database is deliberately NOT defined here. Render's free PostgreSQL
# expires 30 days after creation, which would quietly break a demo link a month
# after you shared it. Neon's free plan does not expire, so the database lives
# there and its connection details are supplied as environment variables below.

services:
  - type: web
    name: cyclehaven-api
    runtime: docker
    rootDir: backend
    # Relative to the REPOSITORY root, not to rootDir above — those two fields
    # resolve differently, and './Dockerfile' would look for one at the repo
    # root and fail the deploy.
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon

    # Render waits for this to return healthy before routing traffic to a new
    # deploy, so a broken release never replaces a working one.
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Render defaults PORT to 10000, and application.yml binds to
      # server.port: ${PORT:8080}. Pinning it to 8080 keeps the port the app
      # listens on, the Dockerfile's EXPOSE and its HEALTHCHECK in agreement;
      # otherwise the container's own health check probes a dead port.
      - key: PORT
        value: 8080

      # Render generates this and stores it encrypted. It never exists in the
      # repository, and rotating it is a dashboard action rather than a commit.
      - key: JWT_SECRET
        generateValue: true

      # sync: false means "prompt me for this value" rather than reading it from
      # this file — correct for anything secret.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # The deployed frontend's origin. Anything not listed here is refused by
      # the browser, so this is what stops another site calling your API with a
      # logged-in user's credentials.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
